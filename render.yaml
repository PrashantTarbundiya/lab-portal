services:
  - type: web
    name: lab-portal-backend
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install && npx prisma generate
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: APP_HASH_SECRET
        generateValue: true
      - key: LAB_NAME
        value: Company A Diagnostics
      - key: OTP_DEMO_MODE
        value: "true"
      - key: DEMO_PASSWORD
        value: Demo@12345
      - key: LINK_TTL_HOURS
        value: "72"
      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3.5-super-vl:free

